function Badge({text,bg,fg}){return <span style={{fontSize:11,padding:"2px 8px",borderRadius:10,background:bg,color:fg,whiteSpace:"nowrap"}}>{text}</span>;}
function Chip({label,selected,onClick}){return <button onClick={onClick} style={{padding:"7px 12px",borderRadius:16,fontSize:12,border:`0.5px solid ${selected?T[200]:G[100]}`,color:selected?T[800]:G[600],background:selected?T[50]:"transparent",cursor:"pointer",whiteSpace:"nowrap"}}>{label}</button>;}

}

      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8,marginTop:24}}><Orb ch={p.ch} dots={p.dots} sz={72} color={p.color}/><div style={{textAlign:"center"}}><div style={{fontSize:20,fontWeight:500,color:TXT}}>{p.name}</div><div style={{fontSize:12,color:G[400],marginTop:2}}>{p.area}</div></div><div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"center"}}>{(p.tags||[]).map(t=><Badge key={t} text={t} bg={T[50]} fg={T[800]}/>)}</div></div>
    </div>
    <div style={{display:"flex",justifyContent:"center",margin:"0 16px",borderRadius:12,overflow:"hidden",border:`0.5px solid ${G[100]}`}}>{[{l:"お手伝い",v:p.completedHelp||0},{l:"依頼",v:p.completedReq||0},{l:"紹介",v:p.referrals||0},{l:"タグ",v:(p.gifted||[]).length}].map((s,i)=><div key={s.l} style={{flex:1,padding:"12px 0",textAlign:"center",borderLeft:i?`0.5px solid ${G[100]}`:"none"}}><div style={{fontSize:18,fontWeight:500,color:TXT}}>{s.v}</div><div style={{fontSize:10,color:G[400],marginTop:2}}>{s.l}</div></div>)}</div>
    <div style={{display:"flex",margin:"12px 16px 0"}}>{[{id:"info",l:"プロフィール"},{id:"activity",l:`活動 (${activity.length})`}].map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"10px 0",fontSize:12,fontWeight:tab===t.id?600:400,color:tab===t.id?T[600]:G[400],background:"none",border:"none",borderBottom:`2px solid ${tab===t.id?T[600]:"transparent"}`,cursor:"pointer"}}>{t.l}</button>)}</div>
    {tab==="info"&&<div style={{padding:"12px 16px"}}>
      {p.bio&&<div style={{fontSize:13,lineHeight:1.7,color:G[600],marginBottom:14}}>{p.bio}</div>}
      <div style={{marginBottom:14}}><div style={{fontSize:12,color:G[400],marginBottom:8}}>SNS</div><SnsLinks sns={p.sns} size="lg"/></div>
      {p.can?.length>0&&<div style={{marginBottom:14}}><div style={{fontSize:12,color:G[400],marginBottom:8}}>できること</div><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{p.can.map(c=><span key={c} style={{fontSize:12,padding:"4px 12px",borderRadius:10,background:p.color[50],color:p.color[800]}}>{c}</span>)}</div></div>}
      {(p.gifted||[]).length>0&&<div style={{marginBottom:14}}><div style={{fontSize:12,color:G[400],marginBottom:8}}>もらったタグ</div><GiftedTags tags={p.gifted}/></div>}
      {p.milkComment&&<div style={{padding:"12px 14px",background:BG2,borderRadius:10}}><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}><Orb ch="mi" dots={6} sz={20} color={T}/><span style={{fontSize:12,fontWeight:500,color:T[800]}}>milkより</span></div><div style={{fontSize:13,lineHeight:1.6,color:G[600]}}>{p.milkComment}</div></div>}
    </div>}
    {tab==="activity"&&<div style={{padding:"8px 16px"}}>
      {activity.length===0&&<div style={{padding:"30px 0",textAlign:"center",color:G[400],fontSize:13}}>まだ活動履歴がありません</div>}
      {activity.map(a=><div key={a.id+a.role} onClick={()=>onSelectPost(a)} style={{marginBottom:8,borderRadius:10,overflow:"hidden",border:`0.5px solid ${G[100]}`,cursor:"pointer"}}>
        {a.report?.photos&&<div style={{display:"flex",height:56}}>{a.report.photos.slice(0,3).map((ph,i)=><div key={i} style={{flex:1,background:ph.color,display:"flex",alignItems:"center",justifyContent:"center",borderRight:i<2?`1px solid ${BG}`:"none"}}><span style={{fontSize:14,opacity:.25}}>{ph.icon}</span></div>)}</div>}
        <div style={{padding:"10px 12px"}}><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}><Badge text={a.role==="helper"?"お手伝い":"依頼"} bg={a.role==="helper"?T[50]:BL[50]} fg={a.role==="helper"?T[800]:BL[800]}/><Badge text={a.tag} bg={a.tagColor[50]} fg={a.tagColor[800]}/><span style={{fontSize:11,color:G[400],marginLeft:"auto"}}>{a.report?.completedDate}</span></div><div style={{fontSize:13,fontWeight:500,color:TXT}}>{a.title}</div></div>
      </div>)}
    </div>}
    <div style={{height:20}}/>
  </div>;
}

function MyPageScreen({onProfile,onSelectPost,favorites,onWriteReport}){
  const [tab,setTab]=useState("activity");
  const matched=posts.filter(p=>p.status==="matched");
  return <div>
    <div style={{padding:"16px 16px 0",borderBottom:`0.5px solid ${G[100]}`}}>
      <div style={{fontSize:18,fontWeight:500,color:TXT,marginBottom:12}}>マイページ</div>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}><Orb ch={myProfile.ch} dots={myProfile.dots} sz={52} color={myProfile.color}/><div style={{flex:1}}><div style={{fontSize:16,fontWeight:500,color:TXT}}>{myProfile.name}</div><div style={{fontSize:12,color:G[400],marginTop:2}}>{myProfile.area}</div><div style={{marginTop:4}}><SnsLinks sns={myProfile.sns}/></div></div><button style={{padding:"6px 12px",borderRadius:8,fontSize:11,color:G[600],background:BG2,border:`0.5px solid ${G[100]}`,cursor:"pointer"}}>編集</button></div>
      <div style={{display:"flex",borderRadius:10,overflow:"hidden",border:`0.5px solid ${G[100]}`,marginBottom:12}}>{[{l:"お手伝い",v:myProfile.completedHelp},{l:"依頼",v:myProfile.completedReq},{l:"紹介",v:myProfile.referrals},{l:"タグ",v:(myProfile.gifted||[]).length},{l:"♥",v:favorites.length}].map((s,i)=><div key={s.l} style={{flex:1,padding:"10px 0",textAlign:"center",borderLeft:i?`0.5px solid ${G[100]}`:"none"}}><div style={{fontSize:16,fontWeight:500,color:TXT}}>{s.v}</div><div style={{fontSize:9,color:G[400],marginTop:1}}>{s.l}</div></div>)}</div>
      {myProfile.gifted?.length>0&&<div style={{marginBottom:12}}><GiftedTags tags={myProfile.gifted}/></div>}
      <div style={{display:"flex"}}>{[{id:"activity",l:"活動履歴"},{id:"favs",l:"お気に入り"}].map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"10px 0",fontSize:12,fontWeight:tab===t.id?600:400,color:tab===t.id?T[600]:G[400],background:"none",border:"none",borderBottom:`2px solid ${tab===t.id?T[600]:"transparent"}`,cursor:"pointer"}}>{t.l}</button>)}</div>
    </div>
    {tab==="activity"&&<div style={{padding:"8px 16px"}}>
      {/* Write report prompt for matched */}
      {matched.map(p=><div key={p.id} style={{padding:"14px",background:`linear-gradient(135deg, ${CO[50]} 0%, ${BG} 100%)`,borderRadius:12,border:`0.5px solid ${CO[400]}33`,marginBottom:10}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}><Badge text={p.tag} bg={p.tagColor[50]} fg={p.tagColor[800]}/><Badge text="マッチ済" bg={T[50]} fg={T[800]}/></div>
        <div style={{fontSize:14,fontWeight:500,color:TXT,marginBottom:6}}>{p.title}</div>
        <div style={{fontSize:12,color:G[600],marginBottom:10}}>完了したらレポートを書きましょう</div>
        <button onClick={()=>onWriteReport(p)} style={{width:"100%",padding:"10px",borderRadius:8,fontSize:13,fontWeight:500,background:T[600],color:"#fff",border:"none",cursor:"pointer"}}>📋 活動レポートを書く</button>
      </div>)}
      {/* Past reports */}
      {resolvedPosts.map(p=><div key={p.id} onClick={()=>onSelectPost(p)} style={{marginBottom:8,borderRadius:10,overflow:"hidden",border:`0.5px solid ${G[100]}`,cursor:"pointer"}}>
        {p.report?.photos&&<div style={{display:"flex",height:56}}>{p.report.photos.slice(0,3).map((ph,i)=><div key={i} style={{flex:1,background:ph.color,display:"flex",alignItems:"center",justifyContent:"center",borderRight:i<2?`1px solid ${BG}`:"none"}}><span style={{fontSize:14,opacity:.25}}>{ph.icon}</span></div>)}</div>}
        <div style={{padding:"10px 12px"}}><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}><Badge text="完了" bg={T[50]} fg={T[800]}/><Badge text={p.tag} bg={p.tagColor[50]} fg={p.tagColor[800]}/><span style={{fontSize:11,color:G[400],marginLeft:"auto"}}>{p.report?.completedDate}</span></div><div style={{fontSize:13,fontWeight:500,color:TXT}}>{p.title}</div></div>
      </div>)}
    </div>}
    {tab==="favs"&&<div style={{padding:"8px 16px"}}>{people.filter(pp=>favorites.includes(pp.id)).map(pp=><div key={pp.id} onClick={()=>onProfile(pp)} style={{display:"flex",alignItems:"center",gap:10,padding:"12px",background:BG,border:`0.5px solid ${G[100]}`,borderRadius:10,marginBottom:8,cursor:"pointer"}}><Orb ch={pp.ch} dots={pp.dots} sz={40} color={pp.color}/><div style={{flex:1}}><div style={{fontSize:14,fontWeight:500,color:TXT}}>{pp.name}</div><div style={{fontSize:11,color:G[400]}}>{pp.can?.join("・")}</div></div><span style={{color:CO[400]}}>♥</span></div>)}</div>}
  </div>;
}

function PeopleScreen({onProfile,favorites}){
  return <div>
    <div style={{padding:"16px 16px 12px",borderBottom:`0.5px solid ${G[100]}`}}><div style={{fontSize:18,fontWeight:500,color:TXT}}>見せる</div><div style={{fontSize:12,color:G[400],marginTop:2}}>milkの周りの頼れる人たち</div></div>
    <div style={{padding:"16px 16px 8px",display:"flex",justifyContent:"center",gap:16,flexWrap:"wrap"}}>{people.map(p=><div key={p.id} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,cursor:"pointer",position:"relative"}} onClick={()=>onProfile(p)}><Orb ch={p.ch} dots={p.dots} sz={52} color={p.color}/>{favorites?.includes(p.id)&&<span style={{position:"absolute",top:-2,right:-2,fontSize:10,color:CO[400]}}>♥</span>}<div style={{fontSize:11,color:G[600]}}>{p.name.slice(0,4)}</div></div>)}</div>
    {people.map(p=><div key={p.id} onClick={()=>onProfile(p)} style={{margin:"8px 16px",padding:"14px 16px",background:BG,border:`0.5px solid ${G[100]}`,borderRadius:12,cursor:"pointer"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}><Orb ch={p.ch} dots={p.dots} sz={44} color={p.color}/><div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:15,fontWeight:500,color:TXT}}>{p.name}</span>{favorites?.includes(p.id)&&<span style={{fontSize:11,color:CO[400]}}>♥</span>}</div><div style={{display:"flex",gap:4,marginTop:4,flexWrap:"wrap"}}>{p.can.map(c=><span key={c} style={{fontSize:11,padding:"2px 8px",borderRadius:10,background:p.color[50],color:p.color[800]}}>{c}</span>)}</div></div></div>
      {(p.gifted||[]).length>0&&<div style={{marginBottom:8}}><GiftedTags tags={p.gifted}/></div>}
      {p.milkComment&&<div style={{padding:"8px 10px",background:BG2,borderRadius:8,fontSize:12,color:G[600],lineHeight:1.5}}><span style={{color:T[800],fontWeight:500}}>milk:</span> {p.milkComment}</div>}
    </div>)}
  </div>;
}

const ROUTES=[{id:"transport",label:"車で送ってほしい",icon:"🚗"},{id:"child",label:"子どもを見てほしい",icon:"👶"},{id:"elderly",label:"高齢の家族のことで",icon:"👴"},{id:"work",label:"作業を手伝ってほしい",icon:"🔨"},{id:"create",label:"何かを作ってほしい",icon:"🎨"},{id:"consult",label:"誰に相談すればいいか\nわからない",icon:"💬"},{id:"living",label:"その他の暮らし",icon:"🏠"}];
function PostScreen(){const [route,setRoute]=useState(null);const [done,setDone]=useState(false);
  if(done)return <div style={{padding:"60px 16px",textAlign:"center"}}><div style={{width:56,height:56,borderRadius:"50%",background:T[50],display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px"}}><svg width="28" height="28" viewBox="0 0 28 28"><path d="M6 14l6 6 10-12" stroke={T[600]} fill="none" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg></div><div style={{fontSize:18,fontWeight:500,color:TXT,marginBottom:8}}>投稿しました</div><button onClick={()=>{setRoute(null);setDone(false);}} style={{marginTop:20,padding:"10px 24px",borderRadius:8,background:T[50],color:T[800],border:"none",fontSize:13,cursor:"pointer"}}>戻る</button></div>;
  if(!route)return <div><div style={{padding:"16px 16px 12px",borderBottom:`0.5px solid ${G[100]}`}}><div style={{fontSize:18,fontWeight:500,color:TXT}}>困りごとを書く</div><div style={{fontSize:12,color:G[400],marginTop:2}}>選んでいくだけで投稿できます</div></div><div style={{padding:16}}><div style={{display:"flex",flexDirection:"column",gap:8}}>{ROUTES.map(r=><button key={r.id} onClick={()=>setRoute(r.id)} style={{padding:"12px 14px",borderRadius:10,border:`0.5px solid ${G[100]}`,background:BG,cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:12}}><span style={{fontSize:20}}>{r.icon}</span><div style={{fontSize:14,fontWeight:500,color:TXT,whiteSpace:"pre-line"}}>{r.label}</div></button>)}</div></div></div>;
  return <div><div style={{padding:"12px 16px",borderBottom:`0.5px solid ${G[100]}`}}><button onClick={()=>setRoute(null)} style={{fontSize:13,color:G[400],background:"none",border:"none",cursor:"pointer"}}>← 戻る</button></div><div style={{padding:"40px 16px",textAlign:"center"}}><div style={{fontSize:40,marginBottom:12}}>{ROUTES.find(r=>r.id===route)?.icon}</div><div style={{fontSize:15,fontWeight:500,color:TXT}}>{ROUTES.find(r=>r.id===route)?.label}</div><div style={{marginTop:20}}><PrimaryBtn onClick={()=>setDone(true)}>投稿する（デモ）</PrimaryBtn></div></div></div>;
}

function IntroduceModal({onClose}){const [sent,setSent]=useState(false);const [msg,setMsg]=useState("");
  if(sent)return <Overlay onClose={onClose}><div style={{padding:"40px 16px",textAlign:"center"}}><div style={{fontSize:32,marginBottom:12}}>🔗</div><div style={{fontSize:16,fontWeight:500,color:TXT}}>紹介しました！</div><button onClick={onClose} style={{marginTop:20,padding:"10px 24px",borderRadius:8,background:T[50],color:T[800],border:"none",fontSize:13,cursor:"pointer"}}>閉じる</button></div></Overlay>;
  return <Overlay onClose={onClose}><div style={{padding:"20px 16px"}}><div style={{width:36,height:4,borderRadius:2,background:G[100],margin:"0 auto 16px"}}/><div style={{fontSize:16,fontWeight:500,color:TXT,marginBottom:12}}>🔗 人を紹介する</div><div style={{fontSize:11,color:G[600],padding:"8px 10px",background:AM[50],borderRadius:8,marginBottom:14,lineHeight:1.5}}>紹介は推薦です。結果の保証ではありません。</div><Label>紹介のコメント（必須）</Label><TextArea placeholder="例: この人なら○○が得意で信頼できます" value={msg} onChange={setMsg}/><div style={{marginTop:14}}><PrimaryBtn onClick={()=>setSent(true)} disabled={!msg}>紹介する</PrimaryBtn></div></div></Overlay>;
}
function ApplyModal({post,onClose}){const [sent,setSent]=useState(false);if(!post)return null;
  if(sent)return <Overlay onClose={onClose}><div style={{padding:"40px 16px",textAlign:"center"}}><div style={{fontSize:32,marginBottom:12}}>🙌</div><div style={{fontSize:16,fontWeight:500,color:TXT}}>応募しました！</div><button onClick={onClose} style={{marginTop:20,padding:"10px 24px",borderRadius:8,background:T[50],color:T[800],border:"none",fontSize:13,cursor:"pointer"}}>閉じる</button></div></Overlay>;
  return <Overlay onClose={onClose}><div style={{padding:"20px 16px"}}><div style={{width:36,height:4,borderRadius:2,background:G[100],margin:"0 auto 16px"}}/><div style={{fontSize:16,fontWeight:500,color:TXT,marginBottom:12}}>🙋 応募する</div><div style={{display:"flex",alignItems:"center",gap:10,padding:"12px",background:BG2,borderRadius:10,marginBottom:14}}><Orb ch={myProfile.ch} dots={myProfile.dots} sz={36} color={myProfile.color}/><div><div style={{fontSize:13,fontWeight:500,color:TXT}}>{myProfile.name}</div><div style={{fontSize:11,color:G[400]}}>{myProfile.area}</div></div></div><PrimaryBtn onClick={()=>setSent(true)}>応募する</PrimaryBtn></div></Overlay>;
}

function NavIcon({type,active}){const c=active?T[600]:G[400];if(type==="board")return <svg width="20" height="20" viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="2" stroke={c} fill="none" strokeWidth="1.2"/><path d="M7 7h6M7 10h4M7 13h5" stroke={c} strokeWidth="1.2" strokeLinecap="round"/></svg>;if(type==="post")return <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" stroke={c} fill="none" strokeWidth="1.2"/><path d="M10 7v6M7 10h6" stroke={c} strokeWidth="1.2" strokeLinecap="round"/></svg>;if(type==="people")return <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="8" cy="7" r="3" stroke={c} fill="none" strokeWidth="1.2"/><circle cx="14" cy="8" r="2.5" stroke={c} fill="none" strokeWidth="1.2"/><path d="M2 16c0-2.8 2.2-5 5-5h2c2.8 0 5 2.2 5 5" stroke={c} fill="none" strokeWidth="1.2"/></svg>;if(type==="mypage")return <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="7" r="3.5" stroke={c} fill="none" strokeWidth="1.2"/><path d="M3.5 17c0-3.3 2.9-6 6.5-6s6.5 2.7 6.5 6" stroke={c} fill="none" strokeWidth="1.2"/></svg>;return null;}

/* ═══ APP ═══ */
function App(){
  const [tab,setTab]=useState("board");const [sel,setSel]=useState(null);const [reportPost,setReportPost]=useState(null);
  const [profileTarget,setProfileTarget]=useState(null);const [applyTarget,setApplyTarget]=useState(null);
  const [introducePost,setIntroducePost]=useState(null);const [writeReportPost,setWriteReportPost]=useState(null);
  const [favorites,setFavorites]=useState(["tanaka","yamada"]);
  const go=t=>{setTab(t);setSel(null);};const toggleFav=id=>setFavorites(f=>f.includes(id)?f.filter(x=>x!==id):[...f,id]);
  const selectPost=(p)=>{if(p.status==="resolved"&&p.report){setReportPost(p);}else{setSel(p);setTab("detail");}};

  return <div style={{maxWidth:430,margin:"0 auto",minHeight:"100vh",display:"flex",flexDirection:"column",background:BG,fontFamily:"-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN',Meiryo,sans-serif",color:TXT}}>
    <div style={{flex:1,overflowY:"auto",paddingBottom:60}}>
      {tab==="board"&&!sel&&<HomeScreen onSelect={selectPost} onProfile={p=>setProfileTarget(p)} onNotif={()=>go("notif")} unreadCount={2}/>}
      {tab==="detail"&&sel&&<DetailScreen post={sel} onBack={()=>go("board")} onProfile={p=>setProfileTarget(p)} onApply={p=>setApplyTarget(p)} onIntroduce={p=>setIntroducePost(p)}/>}
      {tab==="post"&&<PostScreen/>}
      {tab==="people"&&<PeopleScreen onProfile={p=>setProfileTarget(p)} favorites={favorites}/>}
      {tab==="mypage"&&<MyPageScreen onProfile={p=>setProfileTarget(p)} onSelectPost={selectPost} favorites={favorites} onWriteReport={p=>setWriteReportPost(p)}/>}
    </div>
    <div style={{position:"fixed",bottom:0,left:0,right:0,maxWidth:430,margin:"0 auto",display:"flex",borderTop:`0.5px solid ${G[100]}`,background:BG,paddingBottom:"env(safe-area-inset-bottom,8px)",zIndex:20}}>
      {[{id:"board",icon:"board",l:"掲示板"},{id:"post",icon:"post",l:"書く"},{id:"people",icon:"people",l:"見せる"},{id:"mypage",icon:"mypage",l:"マイページ"}].map(n=><button key={n.id} onClick={()=>go(n.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"8px 0 4px",background:"none",border:"none",cursor:"pointer",color:(tab===n.id||(n.id==="board"&&tab==="detail"))?T[600]:G[400],fontSize:10}}><NavIcon type={n.icon} active={tab===n.id||(n.id==="board"&&tab==="detail")}/>{n.l}</button>)}
    </div>
    {reportPost&&<ReportDetailScreen post={reportPost} onBack={()=>setReportPost(null)} onProfile={p=>setProfileTarget(p)}/>}
    {profileTarget&&<ProfileScreen person={profileTarget} onClose={()=>setProfileTarget(null)} onSelectPost={p=>{setProfileTarget(null);selectPost(p);}} favorites={favorites} toggleFav={toggleFav}/>}
    {applyTarget&&<ApplyModal post={applyTarget} onClose={()=>setApplyTarget(null)}/>}
    {introducePost&&<IntroduceModal onClose={()=>setIntroducePost(null)}/>}
    {writeReportPost&&<ReportInputScreen post={writeReportPost} onClose={()=>setWriteReportPost(null)}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
